name: Build and Push ComfyUI CUDA12.8 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: template-append-full.I2V
          push: true
          tags: sidebobshow/comfyui-ltx:i2v

      - name: Build and push FaceID
        uses: docker/build-push-action@v6
        with:
          context: .
          file: template-append-full.faceID
          push: true
          tags: sidebobshow/comfyui-ltx:faceid
